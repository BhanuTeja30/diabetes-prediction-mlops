    params:
      params.yaml:
        data:
          source_url: 
            https://raw.githubusercontent.com/jbrownlee/Datasets/master/pima-indians-diabetes.data.csv
          source_name: Pima Indians Diabetes Database (NIDDK; distributed via 
            the UCI ML Repository / Kaggle)
          raw_path: data/raw/diabetes_raw.csv
          expected_sha256: 
            6bfe5d0f379d17a0e0819b996407e3c09bf80febd4287f2ed212190dfff154af
          processed_dir: data/processed
        split:
          random_seed: 42
          validation_size: 0.2
          test_size: 0.2
        zero_as_missing:
        - glucose
        - blood_pressure
        - skin_thickness
        - insulin
        - bmi
    outs:
