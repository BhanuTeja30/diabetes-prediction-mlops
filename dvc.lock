    - path: src/train.py
      hash: md5
      md5: 80433fb5248ca50eaf62b98ab3851f11
      size: 12825
    params:
      params.yaml:
        models:
          logistic_regression:
            C: 1.0
            max_iter: 1000
            class_weight: balanced
          random_forest:
            n_estimators: 400
            max_depth: 6
            min_samples_leaf: 4
            class_weight: balanced
          xgboost:
            n_estimators: 300
            max_depth: 3
            learning_rate: 0.05
            subsample: 0.9
            colsample_bytree: 0.9
            scale_pos_weight:
        selection:
          target_recall: 0.8
          primary_metric: specificity
          tie_breaker: brier_score
        split.random_seed: 42
        zero_as_missing:
        - glucose
        - blood_pressure
        - skin_thickness
        - insulin
        - bmi
    outs:
