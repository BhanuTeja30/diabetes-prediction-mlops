# Production overrides for a public server. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy (HTTPS on 80/443) is reachable from the internet. It forwards to the Streamlit app.
# The API is internal to the Docker network. MLflow (no login), Prometheus and Grafana listen on the
# server's loopback only: reach them through an SSH tunnel (deploy/aws_deploy.sh tunnel).
services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks: [mlops]
    restart: unless-stopped

  api:
    ports: !reset []

  frontend:
    ports: !reset []

  mlflow:
    # One web worker and no background job runners: 414 MB instead of about 2 GB of RAM.
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --allowed-hosts=localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000},mlflow:5000,localhost,mlflow
    ports: !override
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"

  prometheus:
    ports: !override
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  caddy-data:
  caddy-config:
